# 本仓库的测试（D147）：push / PR 时跑 `tools/` 的 pytest。
#
# 为什么以前没有：这个仓库的工具一直是"本地跑一遍就算"。但 `tools/` 是**发布链的上游**
# （manifest 由它生成、`review` 是铺 CDN 之前的守卫），坏了要等到铺上去才发现 —— 所以补上。
#
# 环境很轻：工具是**纯标准库**（加一个只在抓取时才 import 的 yt-dlp）⇒ CI 里只需要 pytest，
# 不装 uv、不装 yt-dlp、不碰 ffmpeg（那些是 `fetch_audio` / `measure_loudness` 才要的）。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"      # 工具要求 ≥3.11（`tomllib`）

      - name: 装 pytest
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "pytest>=8.0"

      - name: pytest
        working-directory: tools
        run: python -m pytest --junitxml=../pytest-report.xml

      - name: 上传测试报告（失败也传）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 30
          if-no-files-found: warn
