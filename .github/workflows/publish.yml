# 一条链：push 到 `main`（或手动）→ ① 测试 → ② 重打归档（变了才换 `media` 资产）→ ③ 构建站点并部署。
#
# **为什么不用 Cloudflare 的 Workers Builds / Deploy Hook**（D150，2026-09-25 真踩到）：
# 那条路依赖 CF 那边的 Git 集成，连接一失效就**零构建**；而 Deploy Hook 照样回 2xx ⇒ 静默失败，
# 站点停在旧构建上没人知道。现在上线完全由这里负责：日志在 Actions、失败看得见，
# `wrangler deploy` 对静态资源按哈希做**增量上传**（首次全量，之后只传变化的那几首）。
#
# 一次性配置（本仓库 Settings → Secrets and variables → Actions）：
#   * secret `CLOUDFLARE_API_TOKEN` —— CF 面板：My Profile → API Tokens → Create Token，
#     模板用 **Edit Cloudflare Workers**（自定义的话要 `Workers Scripts:Edit` + `Workers Routes:Edit`，
#     后者是自定义域名要用的）。**没配就跳过第③段**（只打印一条 notice，不算失败）。
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只测试 + 重打 + 自检 + 构建，不换资产、不部署
        type: boolean
        default: false

permissions:
  contents: write          # 换 Release 资产要写权限

concurrency:
  group: otomads-publish   # 同一时间只跑一条链，避免两次重打/两次部署撞在一起
  cancel-in-progress: false

env:
  TAG: media
  ASSET: otomads-media.tar.gz
  SITE: https://otomads-cdn.tsukinomiyako-mangesui.top
  CLOUDFLARE_ACCOUNT_ID: 5102f3861137b0abc1a12e2c793c19d2   # 不是机密，写死省一处配置

jobs:
  test:
    name: ① 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"      # 工具要求 ≥3.11（`tomllib`）
      - name: 装依赖
        run: |
          python -m pip install --quiet --upgrade pip
          # 依赖从 `tools/pyproject.toml` 走（不写死版本）：运行时只要 yt-dlp，测试还要 pytest。
          # ⚠️ `yt-dlp` 是**必须**的：fetch 那条路径上有 6 条用例会调 `installed_ytdlp()`
          # ⇒ 只装 pytest 会红（CI 第一次跑就抓到了这个错误假设）。
          python -m pip install --quiet -e ./tools "pytest>=8.0"
      - name: 媒体 Worker 脚本（Range 解析）
        # Worker 本体只能在 CF 上跑，但 `Range` → 闭区间那段解析完全可以在本地钉死
        run: node --test tools/tests/media_worker.test.mjs
      - name: pytest
        working-directory: tools
        # `-rs`：把跳过原因也打出来（悄悄 skip 掉几条等于没有覆盖）
        run: python -m pytest -rs

  repack:
    name: ② 重打归档
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 取上一份归档（媒体来源）
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download "$TAG" --pattern "$ASSET" --dir previous --clobber
          sha256sum "previous/$ASSET"
      - name: 用仓库现在的 packs/ + 响度表重打
        # 媒体只能来自上一份归档（音频不在任何仓库里）；逐曲版本号是**内容**哈希
        # ⇒ 与本机 `pack` 出来的逐字节相同（`tools/tests/test_repack.py` 钉着这条）。
        run: |
          set -euo pipefail
          PYTHONPATH=tools/src python3 -m otomads.stage_media repack \
            --previous "previous/$ASSET" --out "$ASSET"
          sha256sum "$ASSET"
      - name: 自检（**先检查再发布**）
        run: PYTHONPATH=tools/src python3 -m otomads.stage_media review --archive "$ASSET"
      - name: 变了才换资产
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if cmp -s "previous/$ASSET" "$ASSET"; then
            echo "归档逐字节没变 ⇒ 不换资产（只改文档的 push 走这条空路；站点照旧重建一次）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run ⇒ 只报告，不换资产"
            exit 0
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "✅ 已换掉 $TAG 的 $ASSET"

  deploy:
    name: ③ 构建并部署
    needs: repack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 有没有部署令牌
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::没配 secret CLOUDFLARE_API_TOKEN ⇒ 跳过部署（配置方法见 README.ai.MD 的「部署」一节）"
          fi
      - name: 构建站点（下归档 → 自检 → 铺 dist/）
        if: steps.token.outputs.ready == 'true' && inputs.dry_run != true
        # `tools/build_cdn_site.py` 是纯标准库、认 `GITHUB_SHA` / `GITHUB_REF_NAME`，
        # 归档 URL / 落盘名 / 输出目录都能用 `OTOMADS_*` 环境变量覆盖。
        run: python3 tools/build_cdn_site.py
      - name: 部署（Worker 脚本 + 静态资源）
        if: steps.token.outputs.ready == 'true' && inputs.dry_run != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # 读仓库根的 `wrangler.jsonc`：`main`（`/media/*` 的 Range 脚本）+ `assets.directory=./dist`
        # + `routes`（自定义域名在配置里声明，部署才不会把它摘掉）。**不要**再带 `dist` 位置参数。
        run: npx --yes wrangler@4 deploy
      - name: 线上复验
        if: steps.token.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          # 本地这份归档的 sha 与线上 `build-info.json` 自述的 sha 必须一致
          # ⇒ 证明"线上跑的确实是这一份"
          local_sha=$(sha256sum "$ASSET" | cut -d' ' -f1)
          live_sha=""
          for attempt in 1 2 3 4 5 6; do
            info=$(curl -fsS "$SITE/build-info.json" || true)
            live_sha=$(printf '%s' "$info" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['archiveSha256'])" 2>/dev/null || true)
            echo "第 $attempt 次：线上 ${live_sha:0:16}"
            [ "$live_sha" = "$local_sha" ] && break
            sleep 20
          done
          if [ "$live_sha" != "$local_sha" ]; then
            echo "::error::线上归档 sha 与本次构建不一致（${live_sha:0:16} ≠ ${local_sha:0:16}）"
            exit 1
          fi
          printf '%s' "$info" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('✅ 线上已更新：', d['builtAt'], '| commit', (d['commit'] or '(未知)')[:12], '| 归档', d['archiveSha256'][:12])"
          {
            echo "### 素材站已更新"
            echo ""
            echo "- 归档 sha：\`${local_sha:0:16}\`（第②段${{ needs.repack.outputs.changed == 'true' && '换过资产' || '没换资产' }}）"
            echo "- 站点：$SITE"
          } >> "$GITHUB_STEP_SUMMARY"
