[project]
name = "tmc-otomads-tools"
version = "0.1.0"
description = "东方歌牌 · 音MAD 曲包数据仓库的工具：本地曲库助手、抓取/裁剪、响度均衡、录入"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 曲包音频抓取（`otomads.fetch_audio`）。站点改版频繁，所以抓取前会检查并升级到最新版
    # （契约见主仓库 docs/packs-audio-v1.md）；升级会改动 uv.lock，属预期。
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otomads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
