# 音MAD 曲包（otomads）：`joutougu-mayumi` 的曲目。
# 清单与口径见 `packs/otomads.toml` 与 `README.ai.MD`。
# 角色：杖刀偶磨弓（主仓库真源 order = 88）。`name` / `order` 属于主仓库真源（S1），
#   而本文件顶层**只允许** `key` 与可选的 `card`（写别的键会直接报错），所以这两项只留注释；
#   填了曲目后在主仓库跑 `pnpm data:roster`，这个角色就会自动进 `characters.toml`。
# 骨架由主仓库 `pnpm data:scaffold` 生成（D137）；它**不覆盖已有文件**，填过就不用再理它。

key = "joutougu-mayumi"

[[track]]
album = "otomads"
author = "ふゆこけ"                                  # 或 authors = ["甲", "乙"]（只能写一个）
title = "セックスの杖刀人"
extra = "角色曲"
source = "https://www.bilibili.com/video/BV1D1421Z7Cb/"     # 可选：抓取/裁剪用
cover = { original = "https://i0.hdslb.com/bfs/archive/d03eebb9305cfeff50cda57b9883eb10cae1503c.jpg", "16x9" = "https://i0.hdslb.com/bfs/archive/d03eebb9305cfeff50cda57b9883eb10cae1503c.jpg@1048w_589h_1c.webp", "4x3" = "https://i0.hdslb.com/bfs/archive/d03eebb9305cfeff50cda57b9883eb10cae1503c.jpg@873w_655h_1c.webp" }
