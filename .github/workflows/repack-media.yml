# 由仓库改动触发：CI 用**上一份归档里的媒体** + **仓库现在的 `packs/` 与响度表**重打归档，
# 变了就换掉 `media` Release 的资产，然后让 Cloudflare 重建素材站（D149）。
#
# **为什么可以这么做**：CI 里没有曲库（音频不在任何仓库里）⇒ "从零打包"只能在有曲库的机器上做；
# 但**改仓库里那些数据**（曲目表的标题/作者/附加信息/卡面、删曲目、重算的响度表）不需要新音频 ——
# 拿上一份归档的媒体重打一份就行。于是：**推一下仓库，站点自动跟上**。
#
# **不包含**：新音频（`fetch_audio` 只能在有曲库的机器上跑）。声明了却没音频的曲目照旧不出现，
# 由紧接着的 `review` 警告出来（与本地打包同一口径）。
#
# 前置（保证"CI 重打 == 本机打包"）：版本号用**内容**哈希（`packformat.content_revision`，D149）。
# 照 mtime 算的话两边永远对不上 ⇒ 客户端每次重下 324 MB。`test_repack.py` 钉着这条。
name: repack-media

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只重打 + 自检，不换资产、不触发构建
        type: boolean
        default: false

permissions:
  contents: write          # 换 Release 资产要写权限

concurrency:
  group: otomads-media
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
      TAG: media
      ASSET: otomads-media.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"      # 工具要求 ≥3.11（`tomllib`）

      - name: 取上一份归档（媒体来源）
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download "$TAG" --pattern "$ASSET" --dir previous --clobber
          sha256sum "previous/$ASSET"

      - name: 用仓库现在的 packs/ + 响度表重打
        run: |
          set -euo pipefail
          PYTHONPATH=tools/src python3 -m otomads.stage_media repack \
            --previous "previous/$ASSET" --out "$ASSET"
          sha256sum "$ASSET"

      - name: 自检（重打出来的那份，**先检查再发布**）
        run: PYTHONPATH=tools/src python3 -m otomads.stage_media review --archive "$ASSET"

      - name: 变了才换资产
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if cmp -s "previous/$ASSET" "$ASSET"; then
            echo "归档逐字节没变 ⇒ 不换资产（文档 push 之类不该让 340 MB 资产churn）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run ⇒ 只报告，不换资产"
            exit 0
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "✅ 已换掉 $TAG 的 $ASSET"

      - name: 让 Cloudflare 重建素材站
        if: ${{ inputs.dry_run != true }}
        env:
          REASON: ${{ github.event.head_commit.message || 'manual' }}
        run: |
          set -euo pipefail
          [ -n "${CF_DEPLOY_HOOK:-}" ] || { echo "::error::缺 secret CF_DEPLOY_HOOK"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$CF_DEPLOY_HOOK")
          echo "Deploy Hook → HTTP $code（资产${{ steps.publish.outputs.changed == 'true' && '已换' || '没换' }}）"
          case "$code" in
            2*) ;;
            *) echo "::error::Deploy Hook 返回 $code"; exit 1 ;;
          esac
          {
            echo "### 素材站重打 + 重铺"
            echo ""
            echo "- 归档：${{ steps.publish.outputs.changed == 'true' && '**已换**（内容有变化）' || '没换（内容一致）' }}"
            echo "- 触发原因：$REASON"
            echo "- 站点侧改动（Worker 脚本 / 配置）本来就要重建，所以这一步照常做"
          } >> "$GITHUB_STEP_SUMMARY"
