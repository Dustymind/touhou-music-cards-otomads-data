# 让 Cloudflare 重新构建素材站（POST 一次 Deploy Hook，D148）。
#
# **现在的分工**（D149 起）：`push` 那条自动链路已经交给 **`repack-media.yml`** —— 它先用上一份归档的媒体
# 重打一份（带上仓库现在的曲目表/响度表）、变了就换资产，**最后**才 POST 这个 hook。这样不会出现
# "归档还没重打完就先构建一次旧的"。
#
# 这个工作流保留 `workflow_dispatch` 手动入口：想**只重建站点**（不重打归档）时用它，
# 比如 CF 那边刚改过设置、或者上次构建失败要重来。
#
# ⚠️ **但"改仓库里的数据文件"不会改变线上内容**：站点内容来自 `media` Release 里的归档
# （manifest 的逐曲版本号是本机文件的 mtime 指纹，音频库不在 git 里）⇒ 加曲目/换音频必须：
#     pnpm media:pack → gh release upload media otomads-media.tar.gz --clobber -R … → 这条工作流（或面板 Retry）。
# 一次 push 触发的重建会下载 340 MB、跑一遍自检、部署（约 2–3 分钟；静态资源免费、不限量）。
#
# 一次性配置（本仓库 Settings → Secrets and variables → Actions）：
#   * secret `CF_DEPLOY_HOOK` —— CF 面板：Workers & Pages → **otomads-cdn-git** → Settings → Builds →
#     Add deploy hook（名字随意、分支选 `main`）→ 复制那个 URL。
#     ⚠️ 这个 URL **本身就是凭据**（拿到就能触发构建），别贴到公开地方。
name: trigger-cdn

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 为什么重铺（写进运行摘要，便于日后回看）
        required: false
        default: ""

permissions: {}          # 这一步不需要仓库权限，只要那个 hook URL

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 前置检查
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "${CF_DEPLOY_HOOK:-}" ] || {
            echo "::error::缺 secret CF_DEPLOY_HOOK（CF 面板 → 项目 → Settings → Builds → Add deploy hook）"
            exit 1; }

      - name: POST 一次构建
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          # push 触发时 `inputs.reason` 是空的，用 commit 标题顶上
          REASON: ${{ inputs.reason || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$CF_DEPLOY_HOOK")
          echo "Deploy Hook → HTTP $code"
          case "$code" in
            2*) ;;
            *) echo "::error::Deploy Hook 返回 $code（URL 过期/写错了？在 CF 面板重新生成一个）"; exit 1 ;;
          esac
          {
            echo "### 已请求一次 CDN 构建"
            echo ""
            echo "- 项目：CF Pages（Git 集成，生产分支 \`main\`）"
            [ -n "$REASON" ] && echo "- 原因：$REASON"
            echo "- 去看 CF 面板的 Deployments：这次那条的 Source 列会写 **Deploy Hook**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ 已触发；构建结果以 CF 面板为准（这里**不**等它跑完 —— 要等就用 deploy-cdn 那条老路）"
