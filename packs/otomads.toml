# 附加曲包：音MAD（otomads）。
#
# 这些曲目**只存在于本机**（由 `tools/src/tmc/local_source.py` 起本地曲库助手提供），
# 因此不进 `data/sources/*.json` 的镜像表；应用侧按 album 的 `pack` 判定模式归属。
# 角色 → 曲目 的归属沿用改版仓库（v2 工作区）的 `public/character.json`。
#
# 这份文件是**清单**（只声明包与专辑）：曲目在 `data/packs/otomads/<角色 key>.toml`，
# 一角色一份、顶层 `key` 加若干 `[[track]]`，由 `tmc.packs.load_packs` 一并读入；
# 清单里写 `[[track]]` 会直接报错。录入走 `python -m tmc.ingest_pack`（见 data/packs/README.md）。
# 沿革：D52 的首批 24 条 source 抄自 mp3 标签；2026-09 起由 `tools/ingest_otomads.py` 下载
# （D96–D100），条目的 source 行尾注释即来源。

[pack]
id = "otomads"
label_en = "Otomads"
label_zh = "音MAD"
kind = "local"           # local = 曲目地址来自本地曲库助手的 manifest
order = 100

[[album]]
key = "otomads"
name = "otomads"
kind = "other"
pack = "otomads"
order = 100
# 这张专辑名（=曲包名"otomads"）没有展示价值：曲目没作者时**整行不显示**（见 D94）
show_album_name = false
